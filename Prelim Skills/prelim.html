
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Survey Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input, select, textarea, button {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
    }
    .inline-group {
      margin-top: 5px;
    }
    .inline-group label {
      font-weight: normal;
      display: inline-block;
      margin-right: 10px;
    }
    button {
      margin-top: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <h1 id="title">Student Technology Survey</h1>
    <p id="description">
      Please fill out this survey about your technology usage and preferences.
    </p>

    <!-- Form Wrapper -->
    <form id="survey-form">

      <!-- Name -->
      <label id="name-label" for="name">Name</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter your full name"
        required
      >

      <!-- Email -->
      <label id="email-label" for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email address"
        required
      >

      <!-- Number with range -->
      <label id="number-label" for="number">Age</label>
      <input
        type="number"
        id="number"
        name="age"
        placeholder="Enter your age (18-60)"
        min="18"
        max="60"
        required
      >

      <!-- Dropdown -->
      <label for="dropdown">Primary Device Used</label>
      <select id="dropdown" name="device" required>
        <option value="">Select an option</option>
        <option value="laptop">Laptop</option>
        <option value="desktop">Desktop</option>
        <option value="mobile">Mobile Phone</option>
        <option value="tablet">Tablet</option>
      </select>

      <!-- Radio buttons (single selection, same name) -->
      <label>Experience Level in Programming</label>
      <div class="inline-group">
        <label>
          <input type="radio" name="experience" value="beginner" required>
          Beginner
        </label>
        <label>
          <input type="radio" name="experience" value="intermediate">
          Intermediate
        </label>
        <label>
          <input type="radio" name="experience" value="advanced">
          Advanced
        </label>
      </div>

      <!-- Checkboxes (multiple selection, each has value) -->
      <label>Technologies you have used</label>
      <div class="inline-group">
        <label>
          <input type="checkbox" name="tech" value="html"> HTML
        </label>
        <label>
          <input type="checkbox" name="tech" value="css"> CSS
        </label>
        <label>
          <input type="checkbox" name="tech" value="javascript"> JavaScript
        </label>
        <label>
          <input type="checkbox" name="tech" value="python"> Python
        </label>
      </div>

      <!-- Textarea -->
      <label for="comments">Additional Comments</label>
      <textarea
        id="comments"
        name="comments"
        rows="4"
        placeholder="Write your comments here..."
      ></textarea>

      <!-- Submit Button -->
      <button type="submit" id="submit">Submit</button>
    </form>
  </div>
</body>
</html>
